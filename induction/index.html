<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>정전기 유도 실험실</title>
<meta name="description" content="중학생용 정전기 유도 시뮬레이터 — 대전체를 가까이 할 때 금속 안 자유 전자가 이동하는 과정과 검전기의 반응을 관찰한다" />
<link rel="stylesheet" href="../friction/styles.css" />
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="seg" role="tablist" aria-label="모드 선택">
      <button id="tab-can" class="seg-btn selected tap-target" role="tab" aria-selected="true">1. 금속 캔</button>
      <button id="tab-scope" class="seg-btn tap-target" role="tab" aria-selected="false">2. 검전기</button>
    </div>
    <div class="spacer"></div>
    <button id="btn-reset" class="tap-target icon-btn" aria-label="처음으로 되돌리기">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h10a5 5 0 0 1 0 10h-2"/><path d="M7 6l-4 4 4 4"/></svg>
      <span class="btn-text">처음으로</span>
    </button>
    <button id="btn-expand" class="tap-target icon-btn primary" aria-label="크게 보기">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
      <span class="btn-text">크게 보기</span>
    </button>
  </header>

  <main id="board-wrap">
    <canvas id="board" aria-label="정전기 유도 실험 화면"></canvas>
    <p id="hint-bar" role="status"></p>
  </main>

  <nav class="controls" aria-label="조작">
    <div class="ctrl-group">
      <span class="ctrl-label">대전체</span>
      <div class="btn-row" id="rod-buttons">
        <button class="chip tap-target" data-rod="1">(+)전기</button>
        <button class="chip tap-target selected" data-rod="-1">(−)전기</button>
      </div>
    </div>

    <div class="ctrl-group" id="material-group">
      <span class="ctrl-label">물체</span>
      <div class="btn-row" id="material-buttons">
        <button class="chip tap-target selected" data-material="conductor">금속(도체)</button>
        <button class="chip tap-target" data-material="insulator">플라스틱(부도체)</button>
      </div>
    </div>

    <div class="ctrl-group" id="precharge-group" hidden>
      <span class="ctrl-label">검전기 상태</span>
      <div class="btn-row" id="precharge-buttons">
        <button class="chip tap-target selected" data-precharge="0">중성</button>
        <button class="chip tap-target" data-precharge="-3">(−)로 대전됨</button>
      </div>
    </div>

    <div class="ctrl-group">
      <span class="ctrl-label">전하 보기</span>
      <div class="btn-row">
        <button class="chip tap-target selected" data-show-charges="on">보기</button>
        <button class="chip tap-target" data-show-charges="off">안 보기</button>
      </div>
    </div>
  </nav>

</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
