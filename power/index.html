<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>우리 집 전기 사용</title>
<meta name="description" content="중학생용 시뮬레이터 — 가전을 켜고 끄며 소비 전력과 전기 에너지의 전환을 비교한다" />
<link rel="stylesheet" href="../friction/styles.css" />
<style>
  /*
    우리 집 화면은 카드 목록이라 캔버스 대신 HTML로 그린다 — 기기마다 글자 크기·줄바꿈이
    알아서 맞아 작은 화면에서도 읽힌다. 전구 비교 화면만 캔버스다(그림이 본체이므로).
  */
  #home { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px 4px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
  .card {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    border: 2px solid #e2e8f0; border-radius: 12px; background: #fff;
    padding: 8px 6px; min-height: 84px; cursor: pointer; font: inherit; color: inherit;
  }
  .card[aria-pressed="true"] { border-color: #f59e0b; background: #fffbeb; }
  .card .cname { font-size: 13px; font-weight: 600; text-align: center; line-height: 1.25; }
  .card .cwatt { font-size: 12px; color: #64748b; }
  .card .cstate { font-size: 11px; font-weight: 700; color: #94a3b8; }
  .card[aria-pressed="true"] .cstate { color: #b45309; }
  .card .cenergy { font-size: 11px; color: #0f766e; font-weight: 600; }
  .card .cstandby { font-size: 11px; color: #b91c1c; font-weight: 600; }

  .totals { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .total { flex: 1 1 110px; border: 1px solid #e2e8f0; border-radius: 10px; padding: 6px 10px; background: #f8fafc; }
  .total dt { font-size: 11px; color: #64748b; }
  .total dd { margin: 2px 0 0; font-size: 17px; font-weight: 700; }
  .bar { height: 10px; border-radius: 5px; background: #e2e8f0; overflow: hidden; margin-top: 8px; }
  .bar > div { height: 100%; background: #f59e0b; border-radius: 5px; }
  .note { font-size: 11px; color: #94a3b8; margin: 6px 0 0; }
</style>
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="seg" role="tablist" aria-label="모드 선택">
      <button id="tab-home" class="seg-btn selected tap-target" role="tab" aria-selected="true">1. 우리 집</button>
      <button id="tab-compare" class="seg-btn tap-target" role="tab" aria-selected="false">2. 전구 비교</button>
    </div>
    <div class="spacer"></div>
    <button id="btn-expand" class="tap-target icon-btn primary" aria-label="크게 보기">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
      <span class="btn-text">크게 보기</span>
    </button>
  </header>

  <!-- 모드 1: 우리 집 (HTML) -->
  <main id="home">
    <div class="cards" id="cards"></div>
    <dl class="totals">
      <div class="total"><dt>지금 쓰는 전력</dt><dd id="t-watt">0 W</dd></div>
      <div class="total"><dt>1시간 쓰면</dt><dd id="t-kwh">0 kWh</dd></div>
      <div class="total"><dt>1시간 요금</dt><dd id="t-won">0 원</dd></div>
      <div class="total"><dt>1시간 이산화 탄소</dt><dd id="t-co2">0 g</dd></div>
    </dl>
    <div class="bar"><div id="t-bar" style="width:0%"></div></div>
    <p class="note" id="t-note"></p>
  </main>

  <!-- 모드 2: 전구 비교 (캔버스) -->
  <main id="compare-wrap" hidden>
    <canvas id="board" aria-label="두 전구의 에너지 전환을 비교하는 화면"></canvas>
  </main>

  <p id="hint-bar" role="status"></p>

  <nav id="controls-home" class="controls" aria-label="우리 집 조작">
    <div class="ctrl-group">
      <button id="btn-standby" class="chip tap-target">대기 전력 포함</button>
      <button id="btn-alloff" class="chip tap-target">모두 끄기</button>
    </div>
    <div class="ctrl-group">
      <button id="btn-energy" class="chip tap-target">에너지 전환 보기</button>
    </div>
  </nav>

  <nav id="controls-compare" class="controls" aria-label="전구 비교 조작" hidden>
    <div class="ctrl-group">
      <button id="btn-numbers" class="chip tap-target">비율 숫자 보기</button>
    </div>
  </nav>

</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
