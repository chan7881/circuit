<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>우리 집 전기 사용</title>
<meta name="description" content="중학생용 시뮬레이터 — 가전을 켜고 끄며 소비 전력과 전기 에너지의 전환을 비교한다" />
<link rel="stylesheet" href="../friction/styles.css" />
<style>
  /*
    우리 집 화면은 **집을 잘라 본 그림**이다. 기구를 방 안에 놓고 직접 누르게 하고, 배전반에서
    나온 전선이 각 기구로 이어지는 것을 보인다 — 카드 목록보다 "집에서 전기를 쓴다"가 훨씬
    잘 와닿는다(2026-08-07 사용자 피드백). 합계는 그림 아래 HTML로 둔다(숫자는 글자가 또렷한
    편이 읽기 좋고, 화면이 좁아져도 줄바꿈이 알아서 맞는다).
  */
  #home { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 6px 10px 4px; }
  #house { flex: 1; min-height: 0; width: 100%; display: block; touch-action: none; }

  /*
    색은 되도록 공용 변수(--panel·--border·--text)로 쓴다. 그래야 다크 모드에서 저절로 따라온다
    — 값을 직접 박아 두면 어두운 배경에 옅은 회색 글씨가 남아 안 보인다.
    예전에는 이 글자들이 옅은 회색(#64748b·#94a3b8)이라 밝은 화면에서도 잘 안 보였다.
  */
  .totals { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; flex-shrink: 0; }
  .total { flex: 1 1 110px; border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px; background: var(--panel); }
  .total dt { font-size: 12px; color: var(--text); font-weight: 600; }
  .total dd { margin: 2px 0 0; font-size: 17px; font-weight: 700; color: var(--text); }
  .bar { height: 10px; border-radius: 5px; background: var(--border); overflow: hidden; margin-top: 8px; flex-shrink: 0; }
  .bar > div { height: 100%; background: #f59e0b; border-radius: 5px; }
  .note { font-size: 12px; color: var(--text); opacity: 0.8; margin: 6px 0 0; flex-shrink: 0; }

  /* 납작한 임베드에서는 합계 칸을 줄여 집 그림에 자리를 내준다 */
  @media (max-height: 420px) {
    .total dd { font-size: 15px; }
    .note { display: none; }
    .bar { display: none; }
  }
</style>
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="seg" role="tablist" aria-label="모드 선택">
      <button id="tab-home" class="seg-btn selected tap-target" role="tab" aria-selected="true">1. 우리 집</button>
      <button id="tab-compare" class="seg-btn tap-target" role="tab" aria-selected="false">2. 전구 비교</button>
    </div>
    <div class="spacer"></div>
    <button id="btn-expand" class="tap-target icon-btn primary" aria-label="크게 보기">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
      <span class="btn-text">크게 보기</span>
    </button>
  </header>

  <!-- 모드 1: 우리 집 (HTML) -->
  <main id="home">
    <canvas id="house" aria-label="집 안의 전기 기구들. 기구를 눌러 켜고 끌 수 있다"></canvas>
    <dl class="totals">
      <div class="total"><dt>지금 쓰는 전력</dt><dd id="t-watt">0 W</dd></div>
      <div class="total"><dt>한 달 내내 쓰면</dt><dd id="t-kwh">0 kWh</dd></div>
      <div class="total"><dt>한 달 요금</dt><dd id="t-won">0 원</dd></div>
    </dl>
    <div class="bar"><div id="t-bar" style="width:0%"></div></div>
    <p class="note" id="t-note"></p>
    <p class="note" id="t-caveat">이 요금은 1 kWh마다 같은 값을 곱해 어림한 것입니다. 실제 전기 요금은 많이 쓸수록 1 kWh당 값이 올라갑니다(누진제).</p>
  </main>

  <!-- 모드 2: 전구 비교 (캔버스) -->
  <main id="compare-wrap" hidden>
    <canvas id="board" aria-label="두 전구의 에너지 전환을 비교하는 화면"></canvas>
  </main>

  <p id="hint-bar" role="status"></p>

  <nav id="controls-home" class="controls" aria-label="우리 집 조작">
    <div class="ctrl-group">
      <button id="btn-standby" class="chip tap-target">대기 전력 포함</button>
      <button id="btn-alloff" class="chip tap-target">모두 끄기</button>
    </div>
    <div class="ctrl-group">
      <button id="btn-energy" class="chip tap-target">에너지 전환 보기</button>
    </div>
  </nav>

  <nav id="controls-compare" class="controls" aria-label="전구 비교 조작" hidden>
    <div class="ctrl-group">
      <button id="btn-numbers" class="chip tap-target">비율 숫자 보기</button>
    </div>
  </nav>

</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
